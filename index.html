<title>Jabon Practice Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column, four views (setup, test, results, question bank) swapped in place.
   Palette: concrete grey ground, road-sign blue as the accent, signal green / red only for right / wrong. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface2:#e4e8ec; --fg:#14202e; --muted:#5a6878; --line:#ccd3da;
  --accent:#17479e; --accent-fg:#ffffff; --accent-soft:#dbe6f8;
  --good:#12703f; --good-soft:#d9f0e3; --bad:#b3261e; --bad-soft:#fbe0dd; --warn:#8a5a00; --warn-soft:#fbefd0;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --surface2:#222d39; --fg:#e8edf2; --muted:#9aa8b7; --line:#2f3c4a;
  --accent:#7fa8f0; --accent-fg:#0b1523; --accent-soft:#1d2e4a;
  --good:#52c488; --good-soft:#15352a; --bad:#ff8f86; --bad-soft:#40201e; --warn:#f0b955; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --surface2:#222d39; --fg:#e8edf2; --muted:#9aa8b7; --line:#2f3c4a;
  --accent:#7fa8f0; --accent-fg:#0b1523; --accent-soft:#1d2e4a;
  --good:#52c488; --good-soft:#15352a; --bad:#ff8f86; --bad-soft:#40201e; --warn:#f0b955; --warn-soft:#3a2d12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0 16px;border-bottom:3px solid var(--fg)}
.brand{display:flex;flex-direction:column}
.brand b{font:700 28px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:6px}
.tab{background:none;border:2px solid transparent;padding:8px 14px;font-weight:600;border-radius:4px}
.tab[aria-current="page"]{border-color:var(--fg)}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:26px}
.sub{color:var(--muted);margin:0;font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--surface);border:2px solid var(--fg);border-radius:4px;padding:10px 18px;font-weight:600;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:4px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:9px 11px;min-height:42px;width:100%}
textarea{resize:vertical;min-height:84px}
.opt-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opt-row label{display:flex;gap:8px;align-items:center;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
/* test */
.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.prog{flex:1;min-width:140px;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.clock{font:700 32px/1 var(--font-display);font-variant-numeric:tabular-nums;border:2px solid var(--fg);padding:4px 12px;border-radius:4px;min-width:96px;text-align:center}
.clock.low{border-color:var(--bad);color:var(--bad)}
.qno{font:600 14px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qtext{font-size:20px;font-weight:600;line-height:1.35;margin:0;max-width:65ch}
.qimg{max-height:260px;width:auto;max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;align-self:flex-start;padding:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:12px 14px;min-height:54px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .k{font:700 20px var(--font-display);width:32px;height:32px;border-radius:4px;background:var(--surface2);display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-fg)}
.opt img{max-height:90px;max-width:100%;background:#fff;padding:4px;border-radius:3px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt.static{cursor:default}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:40px;border:2px solid var(--line);background:var(--surface);border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums}
.map button.done{background:var(--accent-soft);border-color:var(--accent)}
.map button.cur{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
/* results */
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font:700 72px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--surface2);color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rev{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.rev .why{font-size:14px;color:var(--muted)}
/* bank */
.item{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item>summary::-webkit-details-marker{display:none}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap}
.editor{border:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:4px;font-weight:600;z-index:20;max-width:90vw}
@media (max-width:520px){.big{font-size:56px}.qtext{font-size:18px}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Jabon Driving Institute</b><span>Practice exam</span></div>
    <nav aria-label="Sections">

</div>

<script>
(function(){
"use strict";
const BANK=JSON.parse(document.getElementById('bank-data').textContent);
const IMGS=JSON.parse(document.getElementById('img-data').textContent);
const L='ABCDEF';
const $app=document.getElementById('app');

/* ---------- tiny DOM helper ---------- */
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v===true)n.setAttribute(k,'');
    else n.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(c));}
  return n;
}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

/* ---------- state + persistence ---------- */
const S={custom:[],edits:{},deleted:[],history:[],prefs:{sets:['Word file'],count:30,timer:'total',minutes:30,secs:45,pass:70,shuffle:true,unkeyed:false}};
const LS='jabon-quiz-v1';
let cloudRef=null,saveT=null;
function applyState(o){if(!o)return;for(const k of ['custom','edits','deleted','history','prefs'])if(o[k]!==undefined)S[k]=k==='prefs'?Object.assign(S.prefs,o[k]):o[k];}
try{applyState(JSON.parse(localStorage.getItem(LS)||'null'));}catch(e){}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const json=JSON.stringify({custom:S.custom,edits:S.edits,deleted:S.deleted,history:S.history.slice(-40),prefs:S.prefs});
    try{localStorage.setItem(LS,json);}catch(e){}
    if(cloudRef){try{await cloudRef.set({json});}catch(e){}}
  },400);
}
(async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    cloudRef=db.doc('data/users/'+id+'/quiz');
    const snap=await cloudRef.get();
    if(snap.exists&&snap.data()&&snap.data().json){
      try{applyState(JSON.parse(snap.data().json));}catch(e){}
      if(view==='setup'||view==='bank')render();
    }else if(S.custom.length||Object.keys(S.edits).length||S.deleted.length||S.history.length){save();}
  }catch(e){}
})();

/* ---------- question access ---------- */
function allQs(){
  const out=[];
  for(const b of BANK){
    if(S.deleted.includes(b.id))continue;
    const e=S.edits[b.id];
    out.push(Object.assign({},b,e||{},{edited:!!e}));
  }

/* ----- test engine ----- */
let tick=null;
function stopTimer(){clearInterval(tick);tick=null;}
function startTest(pool){
  const P=S.prefs;
  if(!pool.length){toast('There are no questions to ask from this selection.');return;}
  let qs=P.shuffle?shuffle(pool):pool.slice();
  if(P.count&&qs.length>P.count)qs=qs.slice(0,P.count);
  beginRun(qs,P.sets.join(', '));
}
function beginRun(qs,label){
  const P=S.prefs;
  const items=qs.map(q=>{
    let idx=q.opts.map((_,i)=>i);
    if(P.shuffle&&!q.oimgs)idx=shuffle(idx);
    return {q,order:idx,pick:new Set(),done:false};
  });
  run={phase:'test',items,cur:0,label,start:Date.now(),
    mode:P.timer,total:P.minutes*60,each:P.secs,deadline:null,qDeadline:null,end:null};
  if(run.mode==='total')run.deadline=Date.now()+run.total*1000;
  if(run.mode==='each')run.qDeadline=Date.now()+run.each*1000;
  stopTimer();tick=setInterval(onTick,250);
  go('test');
}
function onTick(){
  if(!run||run.phase!=='test'){stopTimer();return;}
  const c=document.getElementById('clock');
  let left=null;
  if(run.mode==='total')left=(run.deadline-Date.now())/1000;
  if(run.mode==='each')left=(run.qDeadline-Date.now())/1000;
  if(left===null)return;
  if(c){c.textContent=fmt(Math.ceil(left));c.classList.toggle('low',run.mode==='total'?left<=Math.max(30,run.total*.1):left<=10);}
  if(left<=0){
    if(run.mode==='total'){finish(true);}
    else{ if(run.cur<run.items.length-1){run.cur++;run.qDeadline=Date.now()+run.each*1000;render();} else finish(true);}
  }
}
function viewTest(){
  const it=run.items[run.cur],q=it.q,n=run.items.length;

  const multi=q.ans&&q.ans.length>1;
  const prog=el('div',{class:'prog'},el('i',{style:'width:'+(answered/n*100)+'%'}));
  const clock=run.mode==='off'?null:el('div',{class:'clock',id:'clock','aria-label':'Time left',text:fmt(run.mode==='total'?(run.deadline-Date.now())/1000:(run.qDeadline-Date.now())/1000)});
  const opts=el('div',{class:'opts',role:'group','aria-label':'Answers'});
  it.order.forEach((oi,pos)=>{
    const on=it.pick.has(oi);
    opts.append(el('button',{class:'opt',type:'button','aria-pressed':String(on),onclick:()=>choose(oi)},
      el('span',{class:'k',text:L[pos]}),
      q.oimgs&&q.oimgs[oi]?el('img',{src:imgSrc(q.oimgs[oi]),alt:'Option '+L[pos]}):el('span',{text:q.opts[oi]})));
  });
  const map=el('div',{class:'map'},run.items.map((x,i)=>el('button',{type:'button',class:(x.pick.size?'done ':'')+(i===run.cur?'cur':''),'aria-label':'Question '+(i+1),onclick:()=>{run.cur=i;if(run.mode==='each')run.qDeadline=Date.now()+run.each*1000;render();}},String(i+1))));
  $app.append(
    el('div',{class:'bar'},el('span',{class:'qno',text:'Question '+(run.cur+1)+' of '+n}),prog,clock),
    el('section',{class:'panel'},
      el('p',{class:'qtext',text:q.q}),
      qImg(q)?el('img',{class:'qimg',src:qImg(q),alt:'Picture for the question'}):null,
      multi?el('p',{class:'hint',text:'Select all that apply.'}):null,
      !keyed(q)?el('p',{class:'hint',text:'This question has no answer yet, so it will not be scored.'}):null,
      opts,
      el('div',{class:'nav'},
        el('button',{class:'btn',type:'button',disabled:run.cur===0,onclick:()=>step(-1)},'Previous'),
        run.cur<n-1?el('button',{class:'btn primary',type:'button',onclick:()=>step(1)},'Next'):
        el('button',{class:'btn primary',type:'button',id:'finish',onclick:()=>tryFinish()},'Finish test'))),
    el('section',{class:'panel'},el('div',{class:'row'},el('h3',{text:'Jump to a question'}),el('span',{class:'hint',text:answered+' of '+n+' answered'})),map,
      el('div',{class:'row'},el('button',{class:'btn small',type:'button',onclick:()=>tryFinish()},'Finish now')))
  );
}
function step(d){
  run.cur=Math.min(run.items.length-1,Math.max(0,run.cur+d));
  if(run.mode==='each')run.qDeadline=Date.now()+run.each*1000;
  render();window.scrollTo(0,0);
}
function choose(oi){
  const it=run.items[run.cur],multi=it.q.ans&&it.q.ans.length>1;

function tryFinish(){

function grade(it){

}
function finish(timedOut){

}

/* ----- keyboard ----- */
document.addEventListener('keydown',e=>{
  if(!run||run.phase!=='test'||view!=='test')return;
  if(/input|textarea|select/i.test(e.target.tagName))return;
  const k=e.key.toUpperCase(),it=run.items[run.cur];

  const st={q:q?q.q:'',opts:q?q.opts.slice():['','','',''],ans:q?(q.ans||[]).slice():[],multi:q?(q.ans||[]).length>1:false,imgData:q?qImg(q):null,hasOptImgs:!!(q&&q.oimgs)};
  const wrap=el('div',{class:'item editor'});
  const optBox=el('div',{style:'display:flex;flex-direction:column;gap:8px'});
  const imgBox=el('div',{class:'row'});
  const qta=el('textarea',{id:'e-q',placeholder:'Type the question',oninput:e=>st.q=e.target.value});qta.value=st.q;
  function drawImg(){
    imgBox.replaceChildren(
      st.imgData?el('img',{class:'qimg',src:st.imgData,alt:'',style:'max-height:120px'}):null,
      el('label',{class:'btn small'},st.imgData?'Change picture':'Add a picture (optional)',el('input',{type:'file',accept:'image/*',id:'e-img',style:'display:none',onchange:async e=>{const f=e.target.files[0];if(f){try{st.imgData=await shrink(f);drawImg();}catch(err){toast('Could not read that picture');}}}})),
      st.imgData?el('button',{class:'btn small',type:'button',onclick:()=>{st.imgData=null;drawImg();}},'Remove picture'):null);
  }
  function drawOpts(){
    optBox.replaceChildren(...st.opts.map((t,i)=>{
      const on=st.ans.includes(i);
      const inp=el('input',{type:'text',id:'e-o'+i,value:t,'aria-label':'Option '+L[i],placeholder:'Option '+L[i],oninput:e=>st.opts[i]=e.target.value});
      return el('div',{class:'opt-row'},
        el('label',{title:'Mark as the correct answer'},el('input',{type:st.multi?'checkbox':'radio',name:'e-ans',checked:on,'aria-label':'Option '+L[i]+' is correct',
          onchange:e=>{if(st.multi){e.target.checked?st.ans.push(i):st.ans=st.ans.filter(x=>x!==i);}else st.ans=[i];}}),L[i]),
        el('div',{class:'grow'},inp),
        st.opts.length>2?el('button',{class:'btn small',type:'button','aria-label':'Remove option '+L[i],onclick:()=>{st.opts.splice(i,1);st.ans=st.ans.filter(x=>x!==i).map(x=>x>i?x-1:x);drawOpts();}},'Remove'):null);
    }));
  }
  drawImg();drawOpts();
  wrap.append(el('div',{style:'padding:16px;display:flex;flex-direction:column;gap:14px'},
    el('h3',{text:isNew?'Add a question':'Edit question'}),
    st.hasOptImgs?el('p',{class:'hint',text:'This question uses pictures as its answers. You can change the question text, but the picture answers stay as they are.'}):null,
    el('label',{class:'f'},'Question',qta),imgBox,
    st.hasOptImgs?null:el('div',{style:'display:flex;flex-direction:column;gap:8px'},
      el('div',{class:'row'},el('b',{text:'Answers'}),el('span',{class:'hint',text:'Tick the correct one'})),optBox,
      el('div',{class:'row'},
        st.opts.length<6?el('button',{class:'btn small',type:'button',onclick:()=>{st.opts.push('');drawOpts();}},'Add an option'):null,
        el('label',{class:'opt-row'},el('input',{type:'checkbox',id:'e-multi',checked:st.multi,onchange:e=>{st.multi=e.target.checked;if(!st.multi)st.ans=st.ans.slice(0,1);drawOpts();}}),'More than one correct answer'))),
    el('div',{class:'row'},
      el('button',{class:'btn primary',type:'button',id:'e-save',onclick:()=>{
        const text=st.q.trim();
        const opts=st.hasOptImgs?q.opts.slice():st.opts.map(o=>o.trim());
        if(!text)return toast('Type the question first');
        if(!st.hasOptImgs){
          const keep=opts.map((o,i)=>o?i:-1).filter(i=>i>=0);
          if(keep.length<2)return toast('Add at least two answers');
          const map=new Map(keep.map((k,n)=>[k,n]));
          st.ans=st.ans.filter(a=>map.has(a)).map(a=>map.get(a));
          const o2=keep.map(k=>opts[k]);
          commit(q,text,o2,st.ans,st.imgData);
        }else commit(q,text,opts,st.ans,st.imgData);
      }},'Save question'),
      el('button',{class:'btn',type:'button',onclick:()=>{bankUI.editing=null;render();}},'Cancel'))));
  return wrap;
}
function commit(q,text,opts,ans,imgData){
  if(!q){
    S.custom.push({id:'c'+Date.now().toString(36),q:text,opts,ans,imgData:imgData||null});
    toast(ans.length?'Question added':'Added. Mark its correct answer so it can be scored.');
  }else if(q.custom){
    const c=S.custom.find(x=>x.id===q.id);Object.assign(c,{q:text,opts,ans,imgData:imgData||null});toast('Saved');
  }else{
    const e={q:text,ans,unsure:false};
    if(!q.oimgs)e.opts=opts;
    if(imgData&&imgData!==imgSrc(q.img))e.imgData=imgData;
    if(!imgData&&(q.img||q.imgData)){e.imgData=null;e.img=null;}
    S.edits[q.id]=Object.assign({},S.edits[q.id]||{},e);toast('Saved');
  }
  bankUI.editing=null;save();render();
}
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const s=Math.min(1,640/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.75));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

render();
})();
</script>
